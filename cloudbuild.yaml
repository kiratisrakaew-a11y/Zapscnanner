substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: aegis
steps:
  - name: python:3.12
    entrypoint: bash
    args: ["-c", "pip install -r requirements.txt && pytest -q"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.web", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.scanner", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/scanner:$COMMIT_SHA", "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/scanner:$COMMIT_SHA"
