env:
  contexts:
    - name: target
      urls: ["${TARGET_URL}"]
jobs:
  - type: spider
    parameters: {context: target, maxDuration: 5}
  - type: passiveScan-wait
  - type: activeScan
    parameters: {context: target, maxScanDurationInMins: 20}
  - type: report
    parameters: {template: traditional-json, reportDir: /zap/wrk, reportFile: zap-report.json}

